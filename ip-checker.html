<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 地址检测</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 25%, #f0f4ff 50%, #dce8fb 75%, #e6effd 100%);
    color: #1a1a1a;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -180px;
    right: -120px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -140px;
    left: -100px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.12), transparent 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(59, 130, 246, 0.15);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 480px;
    backdrop-filter: blur(24px);
    box-shadow:
      0 4px 24px rgba(59, 130, 246, 0.08),
      0 20px 60px rgba(59, 130, 246, 0.12),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    z-index: 1;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #1a1a1a;
  }

  h1 .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.75); }
  }

  .section {
    background: rgba(59, 130, 246, 0.04);
    border: 1px solid rgba(59, 130, 246, 0.08);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    transition: box-shadow 0.3s;
  }

  .section:hover {
    box-shadow: 0 2px 12px rgba(59, 130, 246, 0.06);
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #5b8def;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .ip-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ip-value {
    font-size: 22px;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-weight: 600;
    color: #111;
    word-break: break-all;
  }

  .ip-value.loading {
    color: #94a3b8;
    font-size: 16px;
    font-family: inherit;
    font-weight: 400;
  }

  .ip-value.error {
    color: #ef4444;
    font-size: 14px;
    font-family: inherit;
    font-weight: 400;
  }

  .copy-btn {
    flex-shrink: 0;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.2);
    color: #3b82f6;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .copy-btn:hover {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.35);
    color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
  }

  .copy-btn:active {
    transform: translateY(0);
  }

  .copy-btn.copied {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.35);
    color: #16a34a;
  }

  .copy-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .geo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .geo-item {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(59, 130, 246, 0.06);
    border-radius: 10px;
    padding: 14px 14px;
  }

  .geo-item .label {
    font-size: 11px;
    color: #6b8bc4;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .geo-item .value {
    font-size: 14px;
    color: #1a1a1a;
    font-weight: 500;
    word-break: break-all;
  }

  .geo-item .value.loading {
    color: #a0b8d8;
    font-weight: 400;
  }

  .geo-item .value.error {
    color: #ef4444;
    font-weight: 400;
  }

  .refresh-hint {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #8aa0c8;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #cbd5e1;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1><span class="dot"></span>IP 地址检测</h1>

  <div class="section">
    <div class="section-label">IPv4</div>
    <div class="ip-row">
      <span id="ipv4" class="ip-value loading"><span class="spinner"></span>检测中...</span>
      <button id="copy-v4" class="copy-btn" disabled>复制</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">IPv6</div>
    <div class="ip-row">
      <span id="ipv6" class="ip-value loading"><span class="spinner"></span>检测中...</span>
      <button id="copy-v6" class="copy-btn" disabled>复制</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">位置信息</div>
    <div class="geo-grid">
      <div class="geo-item">
        <div class="label">城市</div>
        <div id="geo-city" class="value loading">—</div>
      </div>
      <div class="geo-item">
        <div class="label">国家</div>
        <div id="geo-country" class="value loading">—</div>
      </div>
      <div class="geo-item">
        <div class="label">ISP</div>
        <div id="geo-isp" class="value loading">—</div>
      </div>
      <div class="geo-item">
        <div class="label">时区</div>
        <div id="geo-tz" class="value loading">—</div>
      </div>
    </div>
  </div>

  <div class="refresh-hint">页面刷新时自动重新检测</div>
</div>

<script>
function set(el, text) {
  const e = document.getElementById(el);
  e.textContent = text;
  e.classList.remove('loading');
}

function setError(el) {
  const e = document.getElementById(el);
  e.textContent = '不可用';
  e.classList.remove('loading');
  e.classList.add('error');
}

function setupCopy(btnId, sourceId) {
  const btn = document.getElementById(btnId);
  const source = document.getElementById(sourceId);

  btn.addEventListener('click', () => {
    const text = source.textContent;
    if (!text || source.classList.contains('loading') || source.classList.contains('error')) return;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
}

// Try each endpoint in order until one succeeds. Each fetcher receives the
// Response object and returns the IP string (or throws).
async function tryEndpoints(fetchers) {
  for (const fn of fetchers) {
    try {
      return await fn();
    } catch { /* try next */ }
  }
  throw new Error('all endpoints failed');
}

// --- IPv4 fetchers ---
const ipv4Fetchers = [
  async () => {
    const r = await fetch('https://api.ip.sb/ip');
    if (!r.ok) throw new Error();
    return (await r.text()).trim();
  },
  async () => {
    const r = await fetch('https://httpbin.org/ip');
    if (!r.ok) throw new Error();
    return (await r.json()).ip;
  },
  async () => {
    const r = await fetch('https://api.ipify.org?format=json');
    if (!r.ok) throw new Error();
    return (await r.json()).ip;
  },
  async () => {
    const r = await fetch('https://api.my-ip.io/ip');
    if (!r.ok) throw new Error();
    return (await r.text()).trim();
  },
];

// --- IPv6 fetchers ---
const ipv6Fetchers = [
  async () => {
    const r = await fetch('https://api64.ipify.org?format=json');
    if (!r.ok) throw new Error();
    return (await r.json()).ip;
  },
  async () => {
    const r = await fetch('https://api6.ip.sb/ip');
    if (!r.ok) throw new Error();
    return (await r.text()).trim();
  },
];

async function fetchIP(fetchers, elId, btnId) {
  try {
    const ip = await tryEndpoints(fetchers);
    set(elId, ip);
    document.getElementById(btnId).disabled = false;
  } catch {
    setError(elId);
  }
}

// --- Geo fetchers ---
const geoFields = {
  city: 'geo-city',
  country_name: 'geo-country',
  org: 'geo-isp',
  timezone: 'geo-tz',
};

const geoFetchers = [
  // ip-api.com (free, no key, 45 req/min)
  async () => {
    const r = await fetch('https://ip-api.com/json/?fields=city,country,isp,timezone');
    if (!r.ok) throw new Error();
    const d = await r.json();
    if (d.status === 'fail') throw new Error();
    return {
      city: d.city,
      country_name: d.country,
      org: d.isp,
      timezone: d.timezone,
    };
  },
  // ipapi.co
  async () => {
    const r = await fetch('https://ipapi.co/json/');
    if (!r.ok) throw new Error();
    const d = await r.json();
    return {
      city: d.city,
      country_name: d.country_name,
      org: d.org,
      timezone: d.timezone,
    };
  },
  // ipinfo.io
  async () => {
    const r = await fetch('https://ipinfo.io/json');
    if (!r.ok) throw new Error();
    const d = await r.json();
    return {
      city: d.city,
      country_name: d.country,
      org: d.org,
      timezone: d.timezone,
    };
  },
];

async function fetchGeo() {
  try {
    const data = await tryEndpoints(geoFetchers);
    for (const [key, elId] of Object.entries(geoFields)) {
      const val = data[key];
      const el = document.getElementById(elId);
      if (val) {
        el.textContent = val;
        el.classList.remove('loading');
      } else {
        el.textContent = '未知';
        el.classList.remove('loading');
      }
    }
  } catch {
    for (const elId of Object.values(geoFields)) {
      const el = document.getElementById(elId);
      el.textContent = '不可用';
      el.classList.remove('loading');
      el.classList.add('error');
    }
  }
}

setupCopy('copy-v4', 'ipv4');
setupCopy('copy-v6', 'ipv6');

fetchIP(ipv4Fetchers, 'ipv4', 'copy-v4');
fetchIP(ipv6Fetchers, 'ipv6', 'copy-v6');
fetchGeo();
</script>

</body>
</html>
